name: FitTracker CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: 
          node-version: '18'
      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm install
      - name: Run Backend Tests
        working-directory: ./Backend
        run: npm test || echo "Tests will be added later"

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission
        working-directory: ./Frontend/FitTracker-Kotlin
        run: chmod +x ./gradlew
      - name:  Build Debug APK
        working-directory:  ./Frontend/FitTracker-Kotlin
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: fittracker-apk
          path: Frontend/FitTracker-Kotlin/app/build/outputs/apk/debug/*. apk